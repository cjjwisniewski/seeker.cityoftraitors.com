name: Deploy to Azure Blob Storage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
  
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || (sleep 5 && npm ci) || (sleep 10 && npm ci)

      - name: Run SvelteKit typecheck (svelte-check)
        run: npm run check

      - name: Run Linter (prettier & eslint)
        run: npm run lint

      - name: Run isolated CI test suite
        run: npm run test

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || (sleep 5 && npm ci) || (sleep 10 && npm ci)

      - name: Increment PUBLIC_VERSION
        id: increment_version
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          OLD_VERSION: ${{ vars.PUBLIC_VERSION }}
        run: |
          if [[ $OLD_VERSION =~ ^([0-9]+\.[0-9]+\.)([0-9]+)$ ]]; then
            PREFIX="${BASH_REMATCH[1]}"
            PATCH="${BASH_REMATCH[2]}"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${PREFIX}${NEW_PATCH}"
            echo "Incrementing version from $OLD_VERSION to $NEW_VERSION"
            
            if [ -n "$GH_TOKEN" ]; then
              gh api \
                --method PATCH \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /repos/${{ github.repository }}/actions/variables/PUBLIC_VERSION \
                -f name='PUBLIC_VERSION' \
                -f value="$NEW_VERSION" || echo "Failed to update variable. Is REPO_PAT correct?"
            else
              echo "Warning: REPO_PAT secret is not set. Cannot update repository variable."
            fi
            
            echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          else
            echo "Format not recognized: $OLD_VERSION. Expected x.y.z"
            echo "NEW_VERSION=$OLD_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          # --- Variables ---
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_REDIRECT_URI: ${{ vars.DISCORD_REDIRECT_URI }}
          PUBLIC_VERSION: ${{ env.NEW_VERSION }}
          PUBLIC_DISCORD_CLIENT_ID: ${{ vars.PUBLIC_DISCORD_CLIENT_ID }}
          PUBLIC_DISCORD_REDIRECT_URI: ${{ vars.PUBLIC_DISCORD_REDIRECT_URI }}
          PUBLIC_USER_TABLE_FUNCTION_URL: ${{ vars.PUBLIC_USER_TABLE_FUNCTION_URL }}
          PUBLIC_ADD_TO_SEEKING_FUNCTION_URL: ${{ vars.PUBLIC_ADD_TO_SEEKING_FUNCTION_URL }}
          PUBLIC_GET_SEEKING_LIST_FUNCTION_URL: ${{ vars.PUBLIC_GET_SEEKING_LIST_FUNCTION_URL }}
          PUBLIC_DELETE_FROM_SEEKING_FUNCTION_URL: ${{ vars.PUBLIC_DELETE_FROM_SEEKING_FUNCTION_URL }}
          PUBLIC_DELETE_USER_ACCOUNT_FUNCTION_URL: ${{ vars.PUBLIC_DELETE_USER_ACCOUNT_FUNCTION_URL }}
          PUBLIC_GET_USER_TABLES_FUNCTION_URL: ${{ vars.PUBLIC_GET_USER_TABLES_FUNCTION_URL }}
          PUBLIC_GET_SYSTEM_STATUS_FUNCTION_URL: ${{ vars.PUBLIC_GET_SYSTEM_STATUS_FUNCTION_URL }}
          PUBLIC_AUTH_ENDPOINT: ${{ vars.PUBLIC_AUTH_ENDPOINT }}
          PUBLIC_LOGIN_ENDPOINT: ${{ vars.PUBLIC_LOGIN_ENDPOINT }}
          PUBLIC_LOGOUT_ENDPOINT: ${{ vars.PUBLIC_LOGOUT_ENDPOINT }}
          # --- Add missing VITE variables needed by auth.ts ---
          VITE_LOGIN_URL: ${{ vars.VITE_LOGIN_URL }}
          VITE_USER_INFO_URL: ${{ vars.VITE_USER_INFO_URL }}
          PUBLIC_UPDATE_USER_SETTING_FUNCTION_URL: ${{ vars.PUBLIC_UPDATE_USER_SETTING_FUNCTION_URL }}
          PUBLIC_UPDATE_SEEKING_CARD_FUNCTION_URL: ${{ vars.PUBLIC_UPDATE_SEEKING_CARD_FUNCTION_URL }}
          PUBLIC_GET_BANNER_FUNCTION_URL: ${{ vars.PUBLIC_GET_BANNER_FUNCTION_URL }}
          PUBLIC_UPDATE_BANNER_FUNCTION_URL: ${{ vars.PUBLIC_UPDATE_BANNER_FUNCTION_URL }}
          PUBLIC_FETCH_MOXFIELD_DECK_FUNCTION_URL: ${{ vars.PUBLIC_FETCH_MOXFIELD_DECK_FUNCTION_URL || 'https://seeker.azure-api.net/seeker/fetchMoxfieldDeck' }}
          PUBLIC_TRIGGER_STOCK_CHECK_FUNCTION_URL: ${{ vars.PUBLIC_TRIGGER_STOCK_CHECK_FUNCTION_URL || 'https://seeker.azure-api.net/seeker/triggerStockCheck' }}
          PUBLIC_REQUEUE_USER_STOCK_CHECKS_FUNCTION_URL: ${{ vars.PUBLIC_REQUEUE_USER_STOCK_CHECKS_FUNCTION_URL || 'https://seeker.azure-api.net/seeker/requeueUserStockChecks' }}
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync Files to Azure Storage
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            ACCOUNT_NAME="${{ secrets.STORAGE_ACCOUNT_NAME || vars.STORAGE_ACCOUNT_NAME }}"
            echo "Deploying ./build to $web container (immutable assets first, then shell, then stale-blob pruning)"

            # 1. Immutable content-hashed SvelteKit assets first (1 year cache) so active shells never 404
            az storage blob upload-batch \
              --destination '$web' \
              --destination-path '_app/immutable' \
              --account-name "$ACCOUNT_NAME" \
              --source ./build/_app/immutable \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=31536000, immutable"

            # 2. Static icons, manifest, sitemap, robots, security.txt
            for ext in png svg ico webmanifest xml txt; do
              az storage blob upload-batch \
                --destination '$web' \
                --account-name "$ACCOUNT_NAME" \
                --source ./build \
                --pattern "*.$ext" \
                --auth-mode login \
                --overwrite \
                --content-cache-control "public, max-age=86400"
            done

            # 3. Unhashed runtime/service-worker assets: always revalidate
            for blob in service-worker.js theme-init.js _app/env.js _app/version.json; do
              if [ -f "./build/$blob" ]; then
                az storage blob upload \
                  --container-name '$web' \
                  --account-name "$ACCOUNT_NAME" \
                  --name "$blob" \
                  --file "./build/$blob" \
                  --auth-mode login \
                  --overwrite \
                  --content-cache-control "public, max-age=0, must-revalidate"
              fi
            done

            # 4. HTML entry shell last: revalidate at browser, short edge TTL
            az storage blob upload-batch \
              --destination '$web' \
              --account-name "$ACCOUNT_NAME" \
              --source ./build \
              --pattern "*.html" \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=0, s-maxage=300, must-revalidate"

            # 5. Prune stale blobs only after new immutable assets and index.html are live
            LOCAL_FILES=$(cd ./build && find . -type f | sed 's|^\./||' | sort)
            REMOTE_BLOBS=$(az storage blob list --container-name '$web' --account-name "$ACCOUNT_NAME" --auth-mode login --query "[].name" -o tsv | sort)
            STALE_BLOBS=$(comm -23 <(printf "%s\n" "$REMOTE_BLOBS") <(printf "%s\n" "$LOCAL_FILES"))
            if [ -n "$STALE_BLOBS" ]; then
              while IFS= read -r blob; do
                [ -z "$blob" ] && continue
                echo "Pruning stale blob: $blob"
                az storage blob delete \
                  --container-name '$web' \
                  --account-name "$ACCOUNT_NAME" \
                  --name "$blob" \
                  --auth-mode login >/dev/null
              done <<< "$STALE_BLOBS"
            fi


      - name: Azure Logout
        if: always()
        run: az logout
