<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer broken compass ring (leaves gap at bottom for handle) -->
  <path
    d="M 27.6 52.5 A 21 21 0 1 1 36.4 52.5"
    stroke="currentColor"
    stroke-width="3.6"
    stroke-linecap="round"
  />
  <!-- Inner magnifying lens -->
  <circle cx="32" cy="29.5" r="12.5" stroke="currentColor" stroke-width="3.2" />
  <!-- Magnifying handle -->
  <path d="M 32 42.5 V 53.5" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" />
  <!-- 4-pointed compass star -->
  <path
    d="M 32 20.5 L 34.4 27.1 L 41 29.5 L 34.4 31.9 L 32 38.5 L 29.6 31.9 L 23 29.5 L 29.6 27.1 Z"
    fill="currentColor"
  />
</svg>
