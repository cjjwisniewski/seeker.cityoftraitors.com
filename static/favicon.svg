<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="seeker-blue" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5" />
  <!-- Outer broken compass ring (leaves gap at bottom for handle) -->
  <path
    d="M 27.6 52.5 A 21 21 0 1 1 36.4 52.5"
    stroke="url(#seeker-blue)"
    stroke-width="3.6"
    stroke-linecap="round"
  />
  <!-- Inner magnifying lens -->
  <circle cx="32" cy="29.5" r="12.5" stroke="#93c5fd" stroke-width="3.2" />
  <!-- Magnifying handle -->
  <path d="M 32 42.5 V 53.5" stroke="url(#seeker-blue)" stroke-width="4.2" stroke-linecap="round" />
  <!-- 4-pointed compass star -->
  <path
    d="M 32 20.5 L 34.4 27.1 L 41 29.5 L 34.4 31.9 L 32 38.5 L 29.6 31.9 L 23 29.5 L 29.6 27.1 Z"
    fill="#f8fafc"
  />
  <circle cx="32" cy="29.5" r="1.8" fill="#2563eb" />
</svg>
