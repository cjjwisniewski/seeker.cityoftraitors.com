<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
	<title>Seeker</title>
	<link rel="canonical" href="https://seeker.cityoftraitors.com/" />
	<meta name="description" content="Seeker - Multi-marketplace collectible card stock tracker, historical pricing engine, and Discord alert platform." />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Seeker" />
	<meta property="og:title" content="Seeker - Collectible Card Stock &amp; Pricing Platform" />
	<meta property="og:description" content="Multi-marketplace collectible card stock tracker, historical pricing engine, and Discord alert platform." />
	<meta property="og:url" content="https://seeker.cityoftraitors.com/" />
	<meta property="og:image" content="https://seeker.cityoftraitors.com/og-card.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="Seeker - Collectible Card Stock & Pricing Platform" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Seeker - Collectible Card Stock &amp; Pricing Platform" />
	<meta name="twitter:description" content="Multi-marketplace collectible card stock tracker, historical pricing engine, and Discord alert platform." />
	<meta name="twitter:image" content="https://seeker.cityoftraitors.com/og-card.png" />
	<meta name="twitter:image:alt" content="Seeker - Collectible Card Stock & Pricing Platform" />
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@graph": [
				{
					"@type": "WebSite",
					"@id": "https://seeker.cityoftraitors.com/#website",
					"url": "https://seeker.cityoftraitors.com/",
					"name": "Seeker",
					"description": "Multi-marketplace collectible card stock tracker, historical pricing engine, and Discord alert platform."
				},
				{
					"@type": "SoftwareApplication",
					"@id": "https://seeker.cityoftraitors.com/#app",
					"name": "Seeker",
					"url": "https://seeker.cityoftraitors.com/",
					"applicationCategory": "UtilitiesApplication",
					"operatingSystem": "Web",
					"image": "https://seeker.cityoftraitors.com/og-card.png",
					"description": "Multi-marketplace Magic: The Gathering card availability tracker, historical pricing engine, and real-time Discord alert platform."
				}
			]
		}
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
	<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Seeker" />

	%sveltekit.head%
	<script src="%sveltekit.assets%/theme-init.js"></script>
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents" id="svelte-app">
		%sveltekit.body%
	</div>
	<div id="app-loading"
		style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--color-bg-primary, #f3f4f6); z-index: 9999; transition: opacity 0.3s ease;">
		<div
			style="width: 40px; height: 40px; border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: var(--color-primary, #3b82f6); animation: spin 1s ease-in-out infinite;">
		</div>
	</div>
	<style>
		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}
	</style>
</body>

</html>
