<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<title>Seeker</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script src="https://kit.fontawesome.com/257f475bba.js" crossorigin="anonymous"></script>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

	<script>
		(function () {
			const themeKey = 'color-theme';
			const storedTheme = localStorage.getItem(themeKey);
			let themeToApply;

			if (storedTheme && ['light', 'dark'].includes(storedTheme)) {
				themeToApply = storedTheme;
			} else {
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				themeToApply = prefersDark ? 'dark' : 'light';
			}

			document.documentElement.setAttribute('data-theme', themeToApply);
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents" id="svelte-app">
		%sveltekit.body%
	</div>
	<div id="app-loading"
		style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--color-bg-primary, #f3f4f6); z-index: 9999; transition: opacity 0.3s ease;">
		<div
			style="width: 40px; height: 40px; border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: var(--color-primary, #3b82f6); animation: spin 1s ease-in-out infinite;">
		</div>
	</div>
	<style>
		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}
	</style>
	<script>
	</script>
</body>

</html>
